# When connecting to OneBot v11 Napcat, please use this compose file for one-click deployment: https://github.com/NapNeko/NapCat-Docker/blob/main/compose/astrbot.yml

services:
  astrbot:
    # 从本仓库 fork 构建镜像（含自定义核心模块，如 lark.card_action_registry），
    # 不要直接用官方 soulter/astrbot:latest，否则插件 import 自定义核心会失败。
    build:
      context: .
      dockerfile: Dockerfile
    image: gamedataops_astrbot:local
    container_name: astrbot
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - "6185:6185" # AstrBot WebUI
      - "6199:6199" # Optional. OneBot v11 Napcat Websocket Port
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/AstrBot/data
      # - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
